<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><title>Ion</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs><style>
.r{animation:ion-emit 3.6s linear infinite}
.r2{animation-delay:-1.2s}.r3{animation-delay:-2.4s}
.p{animation:ion-ion 2.4s linear infinite}
@keyframes ion-emit{
0%{transform:translateX(-11px);stroke-opacity:0;stroke-width:2.5px}
17%{transform:translateX(-7px);stroke-opacity:.3;stroke-width:2.5px}
50%{transform:translateX(0);stroke-opacity:.6;stroke-width:3px}
83%{transform:translateX(7px);stroke-opacity:1;stroke-width:4px}
100%{transform:translateX(11px);stroke-opacity:0;stroke-width:4px}}
@keyframes ion-ion{0%{transform:translateX(0);opacity:0}20%{opacity:.8}100%{transform:translateX(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.r,.p{animation:none}}

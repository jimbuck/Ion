name: PR Build & Test

on:
  pull_request:
    branches: [ "main" ]

env:
  VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    #- name: Install E2E Dependencies
    #  if: ${{ matrix.os == 'ubuntu-latest' }}
    #  run: |
    #    sudo add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu `lsb_release -sc` main universe restricted multiverse"
    #    sudo apt-get update -y -qq
    #    sudo apt-get install libsdl2-dev
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore tools
      run: dotnet tool restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    # Mesa lavapipe (a CPU Vulkan driver) runs the headless rendering and golden-image tests; Xvfb runs the windowed ones.
    # Without a driver those tests are skipped, not failed. With the Khronos validation layer (and synchronization
    # validation, VK_LAYER_ENABLES in env) the Vulkan tests fail on any validation error.
    - name: Install lavapipe and Xvfb
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: sudo apt-get update -y -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-validationlayers xvfb
    - name: Unit Tests
      if: ${{ matrix.os != 'windows-latest' }}
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=E2E" --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverage.runsettings
    - name: Windowed Vulkan E2E Tests (Xvfb)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: xvfb-run -a dotnet test Ion/Ion.Extensions.Graphics.Vulkan.Tests --configuration Release --no-build --verbosity normal --filter "Category=E2E"
    - name: Unit Tests & E2E Tests
      if: ${{ matrix.os == 'windows-latest' }}
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverage.runsettings
    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5.1.10
      if: ${{ matrix.os == 'windows-latest' }}
      with:
        reports: 'coverage/**/*.cobertura.xml' # REQUIRED # The coverage reports that should be parsed (separated by semicolon). Globbing is supported.
        targetdir: 'CoverageReports' # REQUIRED # The directory where the generated report should be saved.
        reporttypes: 'HtmlInline;MarkdownSummary;Cobertura' # The output formats and scope (separated by semicolon) Values: Badges, Clover, Cobertura, CsvSummary, Html, Html_Dark, Html_Light, HtmlChart, HtmlInline, HtmlInline_AzurePipelines, HtmlInline_AzurePipelines_Dark, HtmlInline_AzurePipelines_Light, HtmlSummary, JsonSummary, Latex, LatexSummary, lcov, MarkdownSummary, MHtml, PngChart, SonarQube, TeamCitySummary, TextSummary, Xml, XmlSummary
        sourcedirs: '' # Optional directories which contain the corresponding source code (separated by semicolon). The source directories are used if coverage report contains classes without path information.
        historydir: '' # Optional directory for storing persistent coverage information. Can be used in future reports to show coverage evolution.
        plugins: '' # Optional plugin files for custom reports or custom history storage (separated by semicolon).
        assemblyfilters: '+*' # Optional list of assemblies that should be included or excluded in the report. Exclusion filters take precedence over inclusion filters. Wildcards are allowed.
        classfilters: '+*' # Optional list of classes that should be included or excluded in the report. Exclusion filters take precedence over inclusion filters. Wildcards are allowed.
        filefilters: '+*' # Optional list of files that should be included or excluded in the report. Exclusion filters take precedence over inclusion filters. Wildcards are allowed.
        verbosity: 'Info' # The verbosity level of the log messages. Values: Verbose, Info, Warning, Error, Off
        title: '' # Optional title.
        tag: '${{ github.run_number }}_${{ github.run_id }}' # Optional tag or build version.
        customSettings: '' # Optional custom settings (separated by semicolon). See: https://github.com/danielpalme/ReportGenerator/wiki/Settings.
        toolpath: 'reportgeneratortool' # Default directory for installing the dotnet tool.
    - uses: actions/upload-artifact@v5
      name: Upload Artifacts
      if: ${{ matrix.os == 'windows-latest' }}
      with:
        name: CoverageReports
        path: CoverageReports/
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: ${{ github.event_name == 'pull_request' && matrix.os == 'windows-latest' }}
      with:
        recreate: true
        path: CoverageReports\Summary.md

  # Proves every benchmark still builds and runs (dry job: one invocation, no statistics). Not a perf gate.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Run benchmarks (dry)
      run: dotnet run -c Release --project Ion/Ion.Benchmarks -- --filter '*' --job dry --artifacts ./bench
    - uses: actions/upload-artifact@v5
      name: Upload benchmark results
      if: ${{ always() }}
      with:
        name: BenchmarkResults
        path: bench/
        if-no-files-found: warn

  # NativeAOT publish of the ECS sample, the Silk.NET quad sample and the UI menu sample. Fails on any trim/AOT warning whose subject is Ion's
  # own code; warnings from third-party packages (Silk.NET.Core, DependencyModel) are reported only.
  aot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install NativeAOT prerequisites
      run: sudo apt-get update -y -qq && sudo apt-get install -y -qq clang zlib1g-dev
    - name: Publish ECS sample with NativeAOT
      shell: bash
      run: |
        set -o pipefail
        # TrimmerSingleWarn=false reports every warning instead of one summary line per assembly.
        dotnet publish Ion.Examples/Ion.Examples.Breakout.ECS -c Release -r linux-x64 \
          -p:PublishAot=true -p:TrimmerSingleWarn=false -o ./aot 2>&1 | tee aot-publish.log
    - name: Publish Silk.NET quad sample with NativeAOT
      shell: bash
      run: |
        set -o pipefail
        dotnet publish Ion.Examples/Ion.Examples.Quad -c Release -r linux-x64 \
          -p:PublishAot=true -p:TrimmerSingleWarn=false -o ./aot-quad 2>&1 | tee -a aot-publish.log
    - name: Publish UI menu sample with NativeAOT
      shell: bash
      run: |
        set -o pipefail
        dotnet publish Ion.Examples/Ion.Examples.Menu -c Release -r linux-x64 \
          -p:PublishAot=true -p:TrimmerSingleWarn=false -o ./aot-menu 2>&1 | tee -a aot-publish.log
    - name: Check for Ion AOT warnings
      shell: bash
      run: |
        echo "Trim/AOT warnings by source:"
        grep -E "warning IL[0-9]+:" aot-publish.log | sort -u \
          | sed -E "s/.*warning IL[0-9]+: ([A-Za-z0-9_]+(\.[A-Za-z0-9_]+)?).*/\1/" | sort | uniq -c | sort -rn || true
        if grep -E "warning IL[0-9]+: (Ion\.|Assembly 'Ion\.)" aot-publish.log; then
          echo "::error::NativeAOT publish produced trim/AOT warnings in Ion code."
          exit 1
        fi
    - uses: actions/upload-artifact@v5
      name: Upload AOT publish log
      if: ${{ always() }}
      with:
        name: AotPublishLog
        path: aot-publish.log

name: PR Build & Test

on:
  pull_request:
    branches: [ "main" ]

env:
  VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    #- name: Install E2E Dependencies
    #  if: ${{ matrix.os == 'ubuntu-latest' }}
    #  run: |
    #    sudo add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu `lsb_release -sc` main universe restricted multiverse"
    #    sudo apt-get update -y -qq
    #    sudo apt-get install libsdl2-dev
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore tools
      run: dotnet tool restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    # Mesa lavapipe (a CPU Vulkan driver) runs the headless rendering and golden-image tests; Xvfb runs the windowed ones.
    # Without a driver those tests are skipped, not failed. With the Khronos validation layer (and synchronization
    # validation, VK_LAYER_ENABLES in env) the Vulkan tests fail on any validation error.
    - name: Install lavapipe and Xvfb
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: sudo apt-get update -y -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-validationlayers xvfb
    - name: Unit Tests
      if: ${{ matrix.os != 'windows-latest' }}
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=E2E" --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverage.runsettings
    - name: Windowed Vulkan E2E Tests (Xvfb)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: xvfb-run -a dotnet test Ion/Ion.Extensions.Graphics.Vulkan.Tests --configuration Release --no-build --verbosity normal --filter "Category=E2E"
    - name: Unit Tests & E2E Tests
      if: ${{ matrix.os == 'windows-latest' }}
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverage.runsettings
    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5.1.10
      if: ${{ matrix.os == 'windows-latest' }}
      with:
        reports: 'coverage/**/*.cobertura.xml' # REQUIRED # The coverage reports that should be parsed (separated by semicolon). Globbing is supported.
        targetdir: 'CoverageReports' # REQUIRED # The directory where the generated report should be saved.
        reporttypes: 'HtmlInline;MarkdownSummary;Cobertura' # The output formats and scope (separated by semicolon) Values: Badges, Clover, Cobertura, CsvSummary, Html, Html_Dark, Html_Light, HtmlChart, HtmlInline, HtmlInline_AzurePipelines, HtmlInline_AzurePipelines_Dark, HtmlInline_AzurePipelines_Light, HtmlSummary, JsonSummary, Latex, LatexSummary, lcov, MarkdownSummary, MHtml, PngChart, SonarQube, TeamCitySummary, TextSummary, Xml, XmlSummary
        sourcedirs: '' # Optional directories which contain the corresponding source code (separated by semicolon). The source directories are used if coverage report contains classes without path information.
        historydir: '' # Optional directory for storing persistent coverage information. Can be used in future reports to show coverage evolution.
        plugins: '' # Optional plugin files for custom reports or custom history storage (separated by semicolon).
        assemblyfilters: '+*' # Optional list of assemblies that should be included or excluded in the report. Exclusion filters take precedence over inclusion filters. Wildcards are allowed.
        classfilters: '+*' # Optional list of classes that should be included or excluded in the report. Exclusion filters take precedence over inclusion filters. Wildcards are allowed.
        filefilters: '+*' # Optional list of files that should be included or excluded in the report. Exclusion filters take precedence over inclusion filters. Wildcards are allowed.
        verbosity: 'Info' # The verbosity level of the log messages. Values: Verbose, Info, Warning, Error, Off
        title: '' # Optional title.
        tag: '${{ github.run_number }}_${{ github.run_id }}' # Optional tag or build version.
        customSettings: '' # Optional custom settings (separated by semicolon). See: https://github.com/danielpalme/ReportGenerator/wiki/Settings.
        toolpath: 'reportgeneratortool' # Default directory for installing the dotnet tool.
    - uses: actions/upload-artifact@v5
      name: Upload Artifacts
      if: ${{ matrix.os == 'windows-latest' }}
      with:
        name: CoverageReports
        path: CoverageReports/
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: ${{ github.event_name == 'pull_request' && matrix.os == 'windows-latest' }}
      with:
        recreate: true
        path: CoverageReports\Summary.md

  # Proves every benchmark still builds and runs (dry job: one invocation, no statistics). Not a perf gate.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Run benchmarks (dry)
      run: dotnet run -c Release --project Ion/Ion.Benchmarks -- --filter '*' --job dry --artifacts ./bench
    - uses: actions/upload-artifact@v5
      name: Upload benchmark results
      if: ${{ always() }}
      with:
        name: BenchmarkResults
        path: bench/
        if-no-files-found: warn

  # NativeAOT publish of the ECS sample, the Silk.NET quad sample and the UI menu sample. Fails on any trim/AOT warning whose subject is Ion's
  # own code; warnings from third-party packages (Silk.NET.Core, DependencyModel) are reported only. The ECS sample is published with the
  # linux-x64 and r36s presets (Stage 7) by the size and startup measurement, which fails only when a desktop executable is over 30 MB.
  aot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install NativeAOT prerequisites
      # clang and lld cross-link linux-arm64 (docs/platforms/r36s.md); qemu-user-static runs the r36s build for its startup time.
      run: sudo apt-get update -y -qq && sudo apt-get install -y -qq clang lld zlib1g-dev qemu-user-static
    - name: Build the arm64 glibc 2.27 sysroot
      run: python3 build/arm64-sysroot.py "$RUNNER_TEMP/sysroot-bionic-arm64"
    - name: Publish sizes and startup (Breakout ECS, linux-x64 and r36s)
      shell: bash
      env:
        IonArm64SysRoot: ${{ runner.temp }}/sysroot-bionic-arm64
        TARGETS: linux-x64 r36s
        RUNS: 10
      run: |
        set -o pipefail
        status=0
        bash docs/plans/benchmarks/2026-09-stage7-publish/measure.sh ./stage7-publish || status=$?
        cat ./stage7-publish/*-publish.log > aot-publish.log
        cat ./stage7-publish/results.md >> "$GITHUB_STEP_SUMMARY"
        exit $status
    - uses: actions/upload-artifact@v5
      name: Upload publish sizes and startup
      if: ${{ always() }}
      with:
        name: Stage7PublishResults
        path: |
          stage7-publish/results.md
          stage7-publish/results.json
          stage7-publish/*-startup.txt
          stage7-publish/*-run.log
          stage7-publish/r36s-arkos/
    - name: Publish Silk.NET quad sample with NativeAOT
      shell: bash
      run: |
        set -o pipefail
        dotnet publish Ion.Examples/Ion.Examples.Quad -p:IonTarget=linux-x64 \
          -p:TrimmerSingleWarn=false -o ./aot-quad 2>&1 | tee -a aot-publish.log
    - name: Publish UI menu sample with NativeAOT
      shell: bash
      run: |
        set -o pipefail
        dotnet publish Ion.Examples/Ion.Examples.Menu -p:IonTarget=linux-x64 \
          -p:TrimmerSingleWarn=false -o ./aot-menu 2>&1 | tee -a aot-publish.log
    - name: Check for Ion AOT warnings
      shell: bash
      run: |
        echo "Trim/AOT warnings by source:"
        grep -E "warning IL[0-9]+:" aot-publish.log | sort -u \
          | sed -E "s/.*warning IL[0-9]+: ([A-Za-z0-9_]+(\.[A-Za-z0-9_]+)?).*/\1/" | sort | uniq -c | sort -rn || true
        if grep -E "warning IL[0-9]+: (Ion\.|Assembly 'Ion\.)" aot-publish.log; then
          echo "::error::NativeAOT publish produced trim/AOT warnings in Ion code."
          exit 1
        fi
    - uses: actions/upload-artifact@v5
      name: Upload AOT publish log
      if: ${{ always() }}
      with:
        name: AotPublishLog
        path: aot-publish.log

  # Desktop presets on their own operating systems (NativeAOT does not cross-compile between operating systems). Off unless the
  # repository variable ION_PUBLISH_CI is 'true'.
  publish-desktop:
    if: ${{ vars.ION_PUBLISH_CI == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win-x64, exe: Ion.Examples.Breakout.ECS.exe }
          - { os: macos-latest, target: osx-arm64, exe: Ion.Examples.Breakout.ECS }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Publish Breakout ECS with the ${{ matrix.target }} preset
      shell: bash
      run: |
        dotnet publish Ion.Examples/Ion.Examples.Breakout.ECS -p:IonTarget=${{ matrix.target }} -o ./publish/${{ matrix.target }}
        size=$(wc -c < "./publish/${{ matrix.target }}/${{ matrix.exe }}")
        echo "${{ matrix.target }}: $((size / 1048576)) MB ($size bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$size" -gt $((30 * 1048576)) ]; then echo "::error::over the 30 MB desktop limit"; exit 1; fi
    - uses: actions/upload-artifact@v5
      with:
        name: BreakoutECS-${{ matrix.target }}
        path: publish/${{ matrix.target }}

  # Mobile heads (Stage 7): skeletons, off unless the repository variable ION_MOBILE_CI is 'true'. -p:IonMobileHeads=true builds the real
  # net10.0-android and net10.0-ios heads (build/Ion.Mobile.props); without it they build as libraries of the shared game code.
  mobile-android:
    if: ${{ vars.ION_MOBILE_CI == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install the android workload
      run: dotnet workload install android
    - name: Publish the Android head (NativeAOT, android-arm64 APK)
      # The hosted runner has the Android SDK in ANDROID_HOME.
      run: >
        dotnet publish Ion.Examples/Ion.Examples.Breakout.ECS.Android -c Release -p:IonMobileHeads=true
        -p:RuntimeIdentifier=android-arm64 -p:AndroidSdkDirectory="$ANDROID_HOME" -o ./publish/android
    - uses: actions/upload-artifact@v5
      with:
        name: BreakoutECS-android
        path: publish/android/*.apk

  mobile-ios:
    if: ${{ vars.ION_MOBILE_CI == 'true' }}
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install the ios workload
      run: dotnet workload install ios
    - name: Build the iOS head for the simulator (no signing)
      # A device build (ios-arm64, NativeAOT) needs a signing identity and provisioning profile: add them as secrets and publish.
      run: dotnet build Ion.Examples/Ion.Examples.Breakout.ECS.iOS -c Release -p:IonMobileHeads=true -p:RuntimeIdentifier=iossimulator-arm64
